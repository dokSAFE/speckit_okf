# Configuration for the speckit-okf extension (OpenWiki engine).
# Copy to .specify/extensions/okf/okf-config.yml (or leave defaults).
#
# Most of the knobs the original speckit_okf extension exposed here
# (bundle layout, granularity, type taxonomy, exclude globs) no longer apply:
# OpenWiki designs its own repository-specific documentation taxonomy per run
# and owns its own ignore rules (.openwikiignore) and bundle layout. What's
# left here is genuinely this extension's own behavior.

okf:
  # Where OpenWiki writes the bundle. OpenWiki's "code" mode always writes to
  # <repo-root>/openwiki/ — this is not currently configurable in OpenWiki
  # itself, so leave this as "openwiki" unless a future OpenWiki version adds
  # a --output-dir style option.
  bundle_dir: "openwiki"

  # Coding-agent host id, used only to pick which MCP-registration check
  # okf-preflight.sh runs and to phrase its fix-it message. It is NOT
  # restricted to OpenWiki's `integrations install` registry (codex, claude,
  # opencode, cursor) — `openwiki mcp --host <id>` itself accepts any
  # lowercase id, it's just provenance metadata. This deployment runs under
  # Junie (JetBrains), which has no `openwiki integrations install` support,
  # so the MCP server was registered by hand in
  # ~/.junie/mcp/mcp.json — see README.md "Setup for Junie".
  # Set to "claude" instead if you're running this extension under Claude
  # Code, where `openwiki integrations install claude` does the MCP
  # registration for you.
  host: "junie"

  # okf.clarify behavior (Junie: /speckit-okf-clarify; Claude: /speckit.okf.clarify).
  # OpenWiki has no built-in "open questions" concept (it prefers to write
  # only what it can verify from source and cite as a Claim). This
  # extension's clarify command instead scans the bundle for uncertainty
  # language, asks you about it, and folds confirmed answers into
  # openwiki/INSTRUCTIONS.md — the one file OpenWiki reads but never
  # overwrites — so the next update run incorporates them.
  clarify:
    max_questions: 20
    # Heuristic phrases okf.clarify greps page bodies for when looking for
    # parked uncertainty worth asking you about.
    uncertainty_markers:
      - "unclear"
      - "not clear from"
      - "unable to verify"
      - "unverified"
      - "TODO"
      - "not documented"
      - "unknown whether"
