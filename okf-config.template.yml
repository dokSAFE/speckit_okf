# Configuration for the speckit-okf extension (OpenWiki engine).
# Copy to .specify/extensions/okf/okf-config.yml (or leave defaults).
#
# Most of the knobs the original speckit_okf extension exposed here
# (bundle layout, granularity, type taxonomy, exclude globs) no longer apply:
# OpenWiki designs its own repository-specific documentation taxonomy per run
# and owns its own ignore rules (.openwikiignore) and bundle layout. What's
# left here is genuinely this extension's own behavior.

okf:
  # Where OpenWiki writes the bundle. OpenWiki's "code" mode always writes to
  # <repo-root>/openwiki/ — this is not currently configurable in OpenWiki
  # itself, so leave this as "openwiki" unless a future OpenWiki version adds
  # a --output-dir style option.
  bundle_dir: "openwiki"

  # Coding-agent host id, as used by `openwiki integrations install <host>`
  # and `openwiki mcp --host <host>`. Spec Kit commands in this extension are
  # written for the "claude" host (Claude Code / Cowork). If you run this
  # extension under a different Spec Kit agent integration, install OpenWiki
  # for that host instead (codex | claude | opencode | cursor) and change
  # this value to match — it's used only for the preflight check message.
  host: "claude"

  # /speckit.okf.clarify behavior. OpenWiki has no built-in "open questions"
  # concept (it prefers to write only what it can verify from source and
  # cite as a Claim). This extension's clarify command instead scans the
  # bundle for uncertainty language, asks you about it, and folds confirmed
  # answers into openwiki/INSTRUCTIONS.md — the one file OpenWiki reads but
  # never overwrites — so the next /speckit.okf.update run incorporates them.
  clarify:
    max_questions: 20
    # Heuristic phrases /speckit.okf.clarify greps page bodies for when
    # looking for parked uncertainty worth asking you about.
    uncertainty_markers:
      - "unclear"
      - "not clear from"
      - "unable to verify"
      - "unverified"
      - "TODO"
      - "not documented"
      - "unknown whether"
