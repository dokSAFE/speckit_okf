# Spec Kit extension manifest
# Docs: https://github.com/github/spec-kit/blob/main/extensions/EXTENSION-DEVELOPMENT-GUIDE.md
schema_version: "1.0"

extension:
  id: "okf"
  name: "OKF Knowledge Bundle Generator"
  version: "0.1.0"
  description: >
    Generates and maintains an Open Knowledge Format (OKF v0.1) knowledge
    bundle from a source-code repository. Adds commands to bootstrap a
    bundle, incrementally update it from git history, and validate
    conformance against the OKF spec
    (https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md).
  author: "Alex Punnen <alexcpn@gmail.com>"
  repository: "https://github.com/alexcpn/speckit_ofk.git"
  homepage: "https://github.com/alexcpn/speckit_ofk"
  license: "MIT"
  tags: [knowledge, okf, documentation, metadata, catalog]
  category: "documentation"
  effect: "read-write"   # creates/modifies files under the knowledge bundle dir

requires:
  speckit_version: ">=0.12.0"

provides:
  commands:
    - name: "speckit.okf.generate"
      file: "commands/generate.md"
    - name: "speckit.okf.update"
      file: "commands/update.md"
    - name: "speckit.okf.validate"
      file: "commands/validate.md"
  config:
    - name: "okf-config.yml"
      template: "okf-config.template.yml"
      required: false
