# Spec Kit extension manifest
# Docs: https://github.com/github/spec-kit/blob/main/extensions/EXTENSION-DEVELOPMENT-GUIDE.md
schema_version: "1.0"

extension:
  id: "okf"
  name: "OKF Knowledge Bundle Generator (OpenWiki engine)"
  version: "1.1.1"
  description: >
    Generates and maintains an Open Knowledge Format (OKF v0.2) knowledge
    bundle from a source-code repository. This is a fork of alexcpn/speckit_okf
    (which shipped OKF v0.1 and did all research/writing/validation itself via
    hand-rolled bash inventory scripts and a single-shot agent prompt) that
    replaces that generation engine with OpenWiki
    (https://github.com/langchain-ai/openwiki), run in-session through its
    coding-agent MCP integration (Claude Code out of the box; Junie/JetBrains
    works too via a manually-registered MCP server, see okf-preflight.sh).
    OpenWiki owns run state, the page queue, Claims (fact-to-source-evidence)
    tracking, index synchronization, Mermaid validation, and OKF
    frontmatter/provenance conformance; this extension's commands drive that
    lifecycle and adapt okf.clarify and okf.validate to OpenWiki's model. No
    separate LLM API key is required: OpenWiki's host integration uses the
    calling agent's own model session.
  author: "Didier (fork); original by Alex Punnen <alexcpn@gmail.com>"
  repository: ""
  homepage: "https://github.com/langchain-ai/openwiki"
  license: "MIT"
  tags: [knowledge, okf, documentation, metadata, catalog, openwiki]
  category: "documentation"
  effect: "read-write"   # creates/modifies files under the knowledge bundle dir (openwiki/)

requires:
  speckit_version: ">=0.12.0"
  tools:
    - name: "openwiki"
      required: true
      version: ">=0.5.0"

# scripts/bash/ and scripts/python/ are plain supporting files, not
# manifest-declared assets — the extension installer copies this whole
# directory tree to .specify/extensions/okf/, and the command files below
# reference the scripts by that hardcoded path. If you move or rename the
# scripts directory, update all command files to match.
provides:
  commands:
    - name: "speckit.okf.generate"
      file: "commands/generate.md"
    - name: "speckit.okf.update"
      file: "commands/update.md"
    - name: "speckit.okf.clarify"
      file: "commands/clarify.md"
    - name: "speckit.okf.validate"
      file: "commands/validate.md"
  config:
    - name: "okf-config.yml"
      template: "okf-config.template.yml"
      required: false
